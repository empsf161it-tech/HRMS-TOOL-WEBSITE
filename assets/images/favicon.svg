<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ellowring">
  <defs>
    <!-- Drop shadow for the 3D ring -->
    <filter id="ring-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>

    <!-- Center disc shadow -->
    <filter id="disc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.28"/>
    </filter>

    <!-- Gradients for the 5 3D glossy segments -->
    <linearGradient id="seg-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="60%" stop-color="#E51821"/>
      <stop offset="100%" stop-color="#B30911"/>
    </linearGradient>

    <linearGradient id="seg-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7028E4"/>
      <stop offset="60%" stop-color="#5414B8"/>
      <stop offset="100%" stop-color="#360882"/>
    </linearGradient>

    <linearGradient id="seg-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8FF"/>
      <stop offset="60%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="seg-green" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#009618"/>
      <stop offset="60%" stop-color="#00B824"/>
      <stop offset="100%" stop-color="#2AE252"/>
    </linearGradient>

    <linearGradient id="seg-yellow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAA600"/>
      <stop offset="60%" stop-color="#FFC500"/>
      <stop offset="100%" stop-color="#FFE169"/>
    </linearGradient>

    <linearGradient id="disc-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Top glossy specular shine -->
    <linearGradient id="gloss-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 3D Segmented Torus Ring with Shadow -->
  <g filter="url(#ring-shadow)">
    <!-- Red Segment (12 to 2:24) -->
    <path d="M 50.00 6.00 A 44 44 0 0 1 91.85 36.40 L 72.83 42.58 A 24 24 0 0 0 50.00 26.00 Z" fill="url(#seg-red)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- Purple Segment (2:24 to 4:48) -->
    <path d="M 91.85 36.40 A 44 44 0 0 1 75.86 85.60 L 64.11 69.42 A 24 24 0 0 0 72.83 42.58 Z" fill="url(#seg-purple)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- Cyan/Blue Segment (4:48 to 7:12) -->
    <path d="M 75.86 85.60 A 44 44 0 0 1 24.14 85.60 L 35.89 69.42 A 24 24 0 0 0 64.11 69.42 Z" fill="url(#seg-blue)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- Green Segment (7:12 to 9:36) -->
    <path d="M 24.14 85.60 A 44 44 0 0 1 8.15 36.40 L 27.17 42.58 A 24 24 0 0 0 35.89 69.42 Z" fill="url(#seg-green)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- Yellow Segment (9:36 to 12:00) -->
    <path d="M 8.15 36.40 A 44 44 0 0 1 50.00 6.00 L 50.00 26.00 A 24 24 0 0 0 27.17 42.58 Z" fill="url(#seg-yellow)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>

    <!-- Inner specular highlight ridge giving rounded torus tube effect -->
    <circle cx="50" cy="50" r="34" fill="none" stroke="url(#gloss-rim)" stroke-width="2.5" opacity="0.65" pointer-events="none"/>
  </g>

  <!-- Center Floating Raised White Disc -->
  <g filter="url(#disc-shadow)">
    <circle cx="50" cy="50" r="14" fill="url(#disc-grad)" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="50" cy="49" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.8"/>
  </g>
</svg>
