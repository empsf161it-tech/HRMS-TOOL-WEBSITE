<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ellowring">
  <defs>
    <filter id="pwa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <filter id="pwa-disc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="pwa-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3B47"/>
      <stop offset="60%" stop-color="#E51821"/>
      <stop offset="100%" stop-color="#A80710"/>
    </linearGradient>

    <linearGradient id="pwa-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7328E8"/>
      <stop offset="60%" stop-color="#5414B8"/>
      <stop offset="100%" stop-color="#340680"/>
    </linearGradient>

    <linearGradient id="pwa-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#19BDFF"/>
      <stop offset="60%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0072B0"/>
    </linearGradient>

    <linearGradient id="pwa-green" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#009418"/>
      <stop offset="60%" stop-color="#00B824"/>
      <stop offset="100%" stop-color="#2EE657"/>
    </linearGradient>

    <linearGradient id="pwa-yellow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAA300"/>
      <stop offset="60%" stop-color="#FFC500"/>
      <stop offset="100%" stop-color="#FFE478"/>
    </linearGradient>

    <linearGradient id="pwa-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="pwa-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Centered Scaled Ring (scale 4.2x from 100x100 space, centered at 256,256) -->
  <g transform="translate(46, 46) scale(4.2)">
    <g filter="url(#pwa-shadow)">
      <path d="M 50.00 6.00 A 44 44 0 0 1 91.85 36.40 L 72.83 42.58 A 24 24 0 0 0 50.00 26.00 Z" fill="url(#pwa-red)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6"/>
      <path d="M 91.85 36.40 A 44 44 0 0 1 75.86 85.60 L 64.11 69.42 A 24 24 0 0 0 72.83 42.58 Z" fill="url(#pwa-purple)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6"/>
      <path d="M 75.86 85.60 A 44 44 0 0 1 24.14 85.60 L 35.89 69.42 A 24 24 0 0 0 64.11 69.42 Z" fill="url(#pwa-blue)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6"/>
      <path d="M 24.14 85.60 A 44 44 0 0 1 8.15 36.40 L 27.17 42.58 A 24 24 0 0 0 35.89 69.42 Z" fill="url(#pwa-green)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6"/>
      <path d="M 8.15 36.40 A 44 44 0 0 1 50.00 6.00 L 50.00 26.00 A 24 24 0 0 0 27.17 42.58 Z" fill="url(#pwa-yellow)" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="url(#pwa-gloss)" stroke-width="2.6" opacity="0.7"/>
    </g>

    <g filter="url(#pwa-disc-shadow)">
      <circle cx="50" cy="50" r="14" fill="url(#pwa-disc)" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="50" cy="49" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.8"/>
    </g>
  </g>
</svg>
