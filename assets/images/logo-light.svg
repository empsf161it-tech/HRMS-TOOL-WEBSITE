<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" role="img" aria-label="Ellowring">
  <defs>
    <!-- Ring drop shadow -->
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="logo-disc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>

    <!-- 5 Segment Gradients -->
    <linearGradient id="l-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3843"/>
      <stop offset="60%" stop-color="#E51821"/>
      <stop offset="100%" stop-color="#B30911"/>
    </linearGradient>
    <linearGradient id="l-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7028E4"/>
      <stop offset="60%" stop-color="#5414B8"/>
      <stop offset="100%" stop-color="#360882"/>
    </linearGradient>
    <linearGradient id="l-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8FF"/>
      <stop offset="60%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="l-green" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#009618"/>
      <stop offset="60%" stop-color="#00B824"/>
      <stop offset="100%" stop-color="#2AE252"/>
    </linearGradient>
    <linearGradient id="l-yellow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAA600"/>
      <stop offset="60%" stop-color="#FFC500"/>
      <stop offset="100%" stop-color="#FFE169"/>
    </linearGradient>

    <linearGradient id="l-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="l-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Left: 5-Segment 3D Glossy Ring Mark (scale 0.68, center y = 38) -->
  <g transform="translate(4, 4) scale(0.68)">
    <g filter="url(#logo-shadow)">
      <path d="M 50.00 6.00 A 44 44 0 0 1 91.85 36.40 L 72.83 42.58 A 24 24 0 0 0 50.00 26.00 Z" fill="url(#l-red)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M 91.85 36.40 A 44 44 0 0 1 75.86 85.60 L 64.11 69.42 A 24 24 0 0 0 72.83 42.58 Z" fill="url(#l-purple)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M 75.86 85.60 A 44 44 0 0 1 24.14 85.60 L 35.89 69.42 A 24 24 0 0 0 64.11 69.42 Z" fill="url(#l-blue)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M 24.14 85.60 A 44 44 0 0 1 8.15 36.40 L 27.17 42.58 A 24 24 0 0 0 35.89 69.42 Z" fill="url(#l-green)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>
      <path d="M 8.15 36.40 A 44 44 0 0 1 50.00 6.00 L 50.00 26.00 A 24 24 0 0 0 27.17 42.58 Z" fill="url(#l-yellow)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.6"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="url(#l-gloss)" stroke-width="2.6" opacity="0.65"/>
    </g>
    <g filter="url(#logo-disc-shadow)">
      <circle cx="50" cy="50" r="14" fill="url(#l-disc)" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="50" cy="49" r="12.5" fill="none" stroke="#FFFFFF" stroke-width="0.75" opacity="0.8"/>
    </g>
  </g>

  <!-- Right: Stylized ELLOWRING Wordmark in Deep Navy -->
  <g fill="#051538" transform="translate(84, 25)">
    <!-- 'E' - 3 Futuristic rounded horizontal bars -->
    <g transform="translate(0, 0)">
      <path d="M 5,0 L 22,0 C 23.5,0 24,0.8 24,2.2 L 24,4.8 C 24,6.2 23.5,7 22,7 L 5,7 C 2,7 0,5.2 0,2.5 C 0,1.2 1.2,0 5,0 Z"/>
      <path d="M 4,11 L 18,11 C 19.5,11 20,11.8 20,13.2 L 20,15.8 C 20,17.2 19.5,18 18,18 L 4,18 C 1.5,18 0,16.5 0,14.5 C 0,12.5 1.5,11 4,11 Z"/>
      <path d="M 5,22 L 22,22 C 23.5,22 24,22.8 24,24.2 L 24,26.8 C 24,28.2 23.5,29 22,29 L 5,29 C 2,29 0,27.2 0,24.5 C 0,23.2 1.2,22 5,22 Z"/>
    </g>

    <!-- 'L' -->
    <path d="M 29,0 L 35,0 L 35,23 L 49,23 L 49,29 L 29,29 Z"/>

    <!-- 'L' -->
    <path d="M 53,0 L 59,0 L 59,23 L 73,23 L 73,29 L 53,29 Z"/>

    <!-- 'O' - Rounded modern squircle -->
    <path d="M 83,0 L 100,0 C 105,0 108,3 108,8 L 108,21 C 108,26 105,29 100,29 L 83,29 C 78,29 75,26 75,21 L 75,8 C 75,3 78,0 83,0 Z M 83,6 C 81.5,6 81,7.2 81,9 L 81,20 C 81,21.8 81.5,23 83,23 L 100,23 C 101.5,23 102,21.8 102,20 L 102,9 C 102,7.2 101.5,6 100,6 Z"/>

    <!-- 'W' - Modern angled techno W -->
    <path d="M 111,0 L 117,0 L 122,19 L 127,0 L 132,0 L 137,19 L 142,0 L 148,0 L 141,29 L 134,29 L 129.5,12 L 125,29 L 118,29 Z"/>

    <!-- 'R' -->
    <path d="M 152,0 L 167,0 C 172,0 175,2.5 175,7.5 L 175,10 C 175,14 172.5,16 168.5,16.5 L 175,29 L 168,29 L 162.2,17 L 158,17 L 158,29 L 152,29 Z M 158,6 L 158,12 L 166,12 C 168,12 169,11 169,9.5 L 169,8.5 C 169,7 168,6 166,6 Z"/>

    <!-- 'I' -->
    <path d="M 179,0 L 185,0 L 185,29 L 179,29 Z"/>

    <!-- 'N' -->
    <path d="M 189,0 L 195,0 L 207,20 L 207,0 L 213,0 L 213,29 L 207,29 L 195,9 L 195,29 L 189,29 Z"/>

    <!-- 'G' -->
    <path d="M 225,0 L 241,0 C 246,0 249,3 249,8 L 249,11 L 243,11 L 243,8.5 C 243,7 242,6 240,6 L 226,6 C 224,6 223,7.2 223,9 L 223,20 C 223,21.8 224,23 226,23 L 240,23 C 242,23 243,22 243,20.5 L 243,16 L 235,16 L 235,11 L 249,11 L 249,21 C 249,26 246,29 241,29 L 225,29 C 220,29 217,26 217,21 L 217,8 C 217,3 220,0 225,0 Z"/>
  </g>
</svg>
